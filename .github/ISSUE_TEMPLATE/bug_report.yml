name: Bug report
description: Report unintended behavior (not security implicated)
title: "[BUG] Unintended behavior found in ..."
labels: [bug]
assignees: [tpaau]

body:
  - type: textarea
    id: description
    attributes:      
      label: Description
      description: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:      
      label: Reproduce
      description: Steps to reproduce
      placeholder: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:      
      label: Expected
      description: Expected behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:      
      label: Actual
      description: Actual behavior
      placeholder: A clear and concise description of what actually happened
    validations:
      required: true

  - type: input
    id: version
    attributes:      
      label: Version
      description: Your version of Chilen
      placeholder: commit f6362fd
    validations:
      required: true


  - type: input
    id: upstream
    attributes:      
      label: Upstream
      description: Upstream confirmation
      placeholder: Confirmation that you cannot reproduce the issue on the latest version of Chilen from the main branch
    validations:
      required: true

  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I agree to follow this project's [AI Policy](https://github.com/tpaau/chilen/blob/main/AI_POLICY.md).
          required: true
