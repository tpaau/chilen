name: Feature request
description: Suggest an in-scope idea for the project
title: "[FEAT] ... would improve the project"
labels: []
assignees: []

body:
  - type: textarea
    id: benefit
    attributes:      
      label: Benefit
      description: Describe the benefit this feature would provide to the project
      placeholder: A clear and concise description of the benefit. 
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:      
      label: Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what specific change you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:      
      label: Alternatives
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: true

  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I agree to follow this project's [AI Policy](https://github.com/tpaau/chilen/blob/main/AI_POLICY.md).
          required: true
