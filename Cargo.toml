[package]
name = "music-player"
version = "0.1.0"
authors = [ "tpaau <tpaau17db@tutamail.com" ]
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
env_logger = "0.11.8"
log = "0.4.29"
clap = { version = "4.5.53", features = [ "derive", "cargo" ] }
bincode = "2.0.1"
interprocess = "2.2.3"
lofty = "0.22.4"
mpipc = { path = "mpipc" }
daemon = { path = "daemon" }
walkdir = "2.5.0"
smol = "2.0.2"
landlock = { version = "0.4.4", optional = true }

# Qt GUI
cxx = { version = "1.0.191", optional = true }
cxx-qt = { version = "0.7.3", optional = true }
cxx-qt-lib = { version = "0.7.3", features = ["qt_full"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.7.3", features = ["link_qt_object_files"], optional = true }

[workspace]
members = [ "daemon", "mpipc" ]

[features]
mpris = ["daemon/mpris"]
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]
landlock = ["dep:landlock"]
linux_package = ["mpris", "gui", "landlock"]
flatpak = ["mpris", "gui"]
default = []
