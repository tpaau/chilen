[package]
name = "music-player"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
env_logger = { version = "0.11.8" }
log = "0.4.29"
clap = { version = "4.5.53", features = ["derive"] }
bincode = "2.0.1"
interprocess = "2.2.3"
serde = "1.0.228"
lofty = "0.22.4"
rodio = "0.21.1"
rusqlite = "0.37.0"
mpris-server = { version = "0.9.0" }
cxx-qt = "0.7.3"
mpipc = { path = "mpipc" }

[features]
default = ["mpris", "gui"]
mpris = []
gui = []
