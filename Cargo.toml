[package]
name = "chilen"
version = "0.1.0"
authors = [ "tpaau <tpaau-17db@tutamail.com>" ]
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
env_logger = "0.11.11"
log = "0.4.29"
clap = { version = "4.6.6", features = [ "derive", "cargo" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
dirs = "6.0.0"
iced = { version = "0.14.0", features = [ "advanced", "image" ] }
iced_widget = { version = "0.14.2" }
chilen_backend = { path = "chilen_backend" }
iced_m3 = { path = "iced_m3" }
rfd = "0.17.2"
iced_core = "0.14.0"
icu = { version = "2.2.0", default-features = false }
sys-locale = "0.3.2"

[features]
# Base features
mpris = [ "chilen_backend/mpris" ]
# Bundles CJK fonts with the binary. Disabling this drastically reduces binary size and may reduce
# RAM usage at the cost of occasional stutters when displaying characters from the CJK font.
cjk_fonts = []
# Additional command-line options for testing.
dev-opts = []

# Presets
linux = [ "mpris", "cjk_fonts" ]
windows = [ "cjk_fonts" ]
macos = [ "cjk_fonts" ]
default = [ "cjk_fonts" ]

[workspace]
members = [
  "chilen_backend",
  "iced_m3",
  "iced_m3/demos/fonts",
  "iced_m3/demos/buttons",
  "iced_m3/demos/fab_menu",
  "iced_m3/demos/progress_indicators"
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
