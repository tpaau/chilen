[package]
name = "chilen"
version = "0.1.0"
authors = [ "tpaau <tpaau-17db@tutamail.com>" ]
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
env_logger = "0.11.10"
log = "0.4.29"
clap = { version = "4.5.53", features = [ "derive", "cargo" ] }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
iced = { version = "0.14.0", features = [ "advanced" ] }
lofty = "0.24.0"
walkdir = "2.5.0"
m3u8 = { path = "m3u8" }
rodio = { version = "0.22.2", features = [ "64bit" ] }
rand = "0.10.2"
mpris-server = { version = "0.10.0", optional = true }
lrc_rs = { version = "0.1.3", default-features = false, features = [ "parser" ] }
smol = "2.0.2"
dirs = "6.0.0"

[features]
mpris = [ "dep:mpris-server" ]
linux_package = [ "mpris" ]
linux_flatpak = [ "mpris" ]
windows = []
macos = []
default = []

[workspace]
members = [
  "m3u8"
]
