[package]
name = "daemon"
version = "0.1.0"
authors = [ "tpaau <tpaau17db@tutamail.com" ]
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
interprocess = "2.2.3"
lofty = "0.22.4"
log = "0.4.29"
mpipc = { path = "../mpipc", default-features = false }
walkdir = "2.5.0"
mpris-server = { version = "0.9.0", optional = true }
serde = { version = "1.0.228", features = [ "derive" ] }
rmp-serde = "1.3.1"
rodio = { version = "0.22.2", features = [ "64bit" ] }
rand = { version = "0.10.0", optional = true }
smol = {version = "2.0.2", optional = true }

[features]
mpris = [ "dep:mpris-server", "dep:smol" ]
shuffle = [ "dep:rand" ]
default = [ "shuffle" ]

[package.metadata.docs.rs]
all-features = true
