[package]
name = "chilen_backend"
version = "0.1.0"
authors = [ "tpaau <tpaau-17db@tutamail.com>" ]
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
lofty = "0.24.0"
log = "0.4.33"
rodio = { version = "0.22.2", features = ["64bit"] }
serde = { version = "1.0.228", features = ["derive"] }
walkdir = "2.5.0"
m3u8_rs = { git = "https://github.com/tpaau/m3u8_rs" }
lrc_rs = { version = "0.1.3", default-features = false, features = [ "parser" ] }
mpris-server = { version = "0.10.0", optional = true }
rmp-serde = "1.3.1"
smol = "2.0.2"
rand = "0.10.2"

[features]
mpris = [ "dep:mpris-server" ]
